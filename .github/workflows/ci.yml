name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: python -m pip install Pillow==13.0.0
      - run: python -m unittest discover -s companion -p "*_test.py"
      - run: python -m compileall -q companion
      - name: Build and inspect Windows package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\companion\Build.ps1
          node scripts/release-check.mjs --package
  gateway-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit --prefix gateway --audit-level=high
      - run: npm audit --prefix companion/backend --omit=dev --audit-level=high
