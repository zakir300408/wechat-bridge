name: Bug report
description: Report a problem using redacted diagnostics and synthetic examples.
body:
  - type: markdown
    attributes:
      value: Do not include private links, keys, DPAPI files, real messages, contacts or media. Use Security → Report a vulnerability for security issues.
  - type: input
    id: version
    attributes:
      label: Package version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Expected behavior, actual behavior and steps to reproduce
      description: Use synthetic names and redact all private credentials/data.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed, redacted doctor output
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private links, account identifiers, keys, source messages and media.
          required: true
